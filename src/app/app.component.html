<div
  class="app-container"
  [class.rtl]="isRtl"
  [class.ltr]="!isRtl"
  [class.arabic]="currentLang === 'ar'"
  [class.english]="currentLang === 'en'"
>
  <!-- Error and Network Status Notifications -->
  <app-error-notification></app-error-notification>

  <!-- Header Component - Hidden for admin routes and discount page -->
  <app-header *ngIf="!isAdminRoute && !isDiscountRoute"></app-header>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer Component - Hidden for admin routes and discount page -->
  <app-footer *ngIf="!isAdminRoute && !isDiscountRoute"></app-footer>

  <!-- Floating WhatsApp Button - Hidden for admin routes and discount page -->
  <a
    *ngIf="!isAdminRoute && !isDiscountRoute"
    href="https://wa.me/201234567890"
    target="_blank"
    class="floating-whatsapp"
    title="تواصل معنا على WhatsApp"
    aria-label="تواصل معنا على WhatsApp"
    rel="noopener noreferrer"
  >
    <i class="fab fa-whatsapp" aria-hidden="true"></i>
  </a>
</div>
